<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Judi’s Pro Park Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&family=Yellowtail&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf3ef;--card:#fff;--ink:#22212b;--muted:#665f6b;--frame:#f4a99b;--line:#e8cfc7;--ok:#1f8a5f;--gold:#f6c445;--goldink:#3a2a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1519;--card:#2a2227;--ink:#f6ecee;--muted:#b9a9b0;--frame:#c4685a;--line:#4a3a40;--ok:#4cc38f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1519;--card:#2a2227;--ink:#f6ecee;--muted:#b9a9b0;--frame:#c4685a;--line:#4a3a40;--ok:#4cc38f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 Figtree,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 12px 48px}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,sans-serif;margin:0;line-height:1.1}
.script{font-family:Yellowtail,cursive;font-weight:400}
.lead{color:var(--muted);margin:8px 0 20px}
.park{display:block;width:100%;text-align:left;background:var(--card);border:3px solid var(--frame);border-radius:18px;padding:16px 18px;margin-bottom:12px;color:inherit;font:inherit;cursor:pointer}
.park .script{font-size:2.2rem;line-height:1.1}
.park p{margin:2px 0 10px;color:var(--muted);font-size:.95rem}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.small{font-size:.85rem;color:var(--muted);margin-top:6px}
.back,.reset{background:none;border:0;color:var(--muted);font:600 1rem Figtree,sans-serif;padding:8px 0;cursor:pointer}
.reset{font-weight:400;text-decoration:underline}
.board{background:var(--frame);padding:10px;border-radius:6px;margin-top:6px}
.title{background:var(--card);text-align:center;padding:8px 6px 10px;margin-bottom:8px}
.title .script{font-size:2.6rem;line-height:1.05;display:block}
.title b{font:800 1.4rem "Bricolage Grotesque",sans-serif;letter-spacing:.02em}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.cell{position:relative;aspect-ratio:1;background:var(--card);border:0;border-radius:2px;padding:3px;display:flex;align-items:center;justify-content:center;text-align:center;font:800 .62rem/1.15 "Bricolage Grotesque",sans-serif;color:var(--ink);cursor:pointer;overflow:hidden;hyphens:auto}
.cell:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.cell.found{background:var(--ok);color:#fff}
.cell.found::after{content:"\2713";position:absolute;right:3px;top:0;font-size:.9rem}
.cell.skip{opacity:.45;text-decoration:line-through}
.cell.line{box-shadow:inset 0 0 0 3px var(--gold)}
.stats{display:flex;justify-content:space-between;margin:12px 2px 0;font-weight:600}
.banner{background:var(--gold);color:var(--goldink);font-weight:800;border-radius:12px;padding:10px 14px;margin:10px 0;text-align:center}
.sheet,.certwrap{position:fixed;inset:0;background:rgba(20,10,16,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet>div{max-height:92vh;overflow:auto;background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-size:1.4rem;margin-bottom:6px}
.sheet p{margin:0 0 16px}
.row{display:flex;gap:8px}
.btn{flex:1;min-height:48px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--ink);font:600 1rem Figtree,sans-serif;cursor:pointer}
.btn.main{background:var(--gold);border-color:var(--gold);color:var(--goldink)}
.certwrap{align-items:center;overflow:auto;padding:16px}
.cert{background:#fffdf8;color:#2b2118;border:10px double #c8933a;max-width:520px;width:100%;padding:26px 20px;text-align:center}
.cert .script{font-size:2.4rem;line-height:1.1;display:block;margin:6px 0}
.cert h2{font-size:1.2rem;letter-spacing:.04em}
.cert input{font:400 2rem Yellowtail,cursive;text-align:center;border:0;border-bottom:2px solid #c8933a;background:transparent;color:#2b2118;width:100%;padding:2px}
.cert p{margin:8px 0}
.certbtns{max-width:520px;width:100%;margin-top:12px}
.certbtns .btn{color:#fff;border-color:#fff}
.certbtns .btn.main{color:var(--goldink)}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}.strip img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;display:block}.hintimg{width:100%;max-height:45vh;object-fit:contain;border-radius:10px;margin:8px 0 14px}
.parkhead{margin:22px 0 8px;font-size:1.2rem}
.srow{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:6px;color:var(--ink);font:600 1rem Figtree,sans-serif;cursor:pointer;min-height:48px}
.srow small{color:var(--muted);font-weight:400;white-space:nowrap}
.srow.found{background:var(--ok);border-color:var(--ok);color:#fff}.srow.found small{color:#fff}
.srow:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.agent{display:flex;gap:14px;align-items:center;background:var(--card);border:2px solid var(--frame);border-radius:16px;padding:12px 14px;margin:0 0 14px;line-height:1.35}
.agent img{width:80px;height:80px;border-radius:50%;object-fit:cover;flex:none}.agent>div{min-width:0}.agent a{color:inherit;font-size:.8rem;overflow-wrap:anywhere}
.players{margin:0 0 18px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;min-height:42px;font:600 .95rem Figtree,sans-serif;cursor:pointer}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--goldink)}
.chip:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#addbox,#renbox{display:flex;gap:6px;margin-top:8px}#addbox[hidden],#renbox[hidden]{display:none}
input#pname,input#rname,textarea{flex:1;width:100%;border:2px solid var(--line);border-radius:10px;padding:10px;background:var(--card);color:var(--ink);font:400 1rem Figtree,sans-serif;margin:6px 0}
#addbox .btn,#renbox .btn{flex:none;padding:0 18px}
.save{margin:20px 0}.save summary{cursor:pointer;font-weight:600;min-height:40px}.save .btn{width:100%;margin:4px 0}
.lb{display:grid;grid-template-columns:2rem 1fr auto;gap:8px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.lb.first{border-color:var(--gold);background:var(--gold);color:var(--goldink)}
.lb small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}.lb.first small{color:var(--goldink)}
.strip:empty{display:none}
.banner2{background:linear-gradient(135deg,#f4a99b,#f6c445);color:#2a1a10;border-radius:18px;padding:22px 16px;text-align:center;margin:0 0 14px}
.banner2 .script{display:block;font-size:2.6rem;line-height:1.05}
.banner2 small{display:block;font-weight:600;margin-top:6px;font-size:.95rem}
.rank{background:var(--card);border:2px solid var(--gold);border-radius:14px;padding:10px 14px;margin:0 0 16px}
.rank b{display:block;font:800 1.3rem "Bricolage Grotesque",sans-serif}.rank small{color:var(--muted)}
.lb i{font-style:normal;font-weight:400;font-size:.8rem;margin-left:4px}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@media print{body>*:not(#certroot){display:none!important}#certroot .certwrap{position:static;background:none;display:block}.certbtns{display:none}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
@media (min-width:480px){.cell{font-size:.75rem}}
</style>
</head>

var AGENCY=AGENT.agency||AGENT.name||"";
var KEY="parkquest:";
var app=document.getElementById("app");
var state={};
var LINES=[];
(function(){for(var r=0;r<5;r++){var a=[],b=[];for(var c=0;c<5;c++){a.push(r*5+c);b.push(c*5+r)}LINES.push(a,b)}
LINES.push([0,6,12,18,24],[4,8,12,16,20])})();

function loadPlayers(){try{var v=JSON.parse(localStorage.getItem(KEY+"players")||"null");if(v&&v.list&&v.list.length)return v}catch(e){}return {list:[{id:"p1",name:"Player 1"}],cur:"p1"}}
var PL=loadPlayers();
function savePlayers(){try{localStorage.setItem(KEY+"players",JSON.stringify(PL))}catch(e){}}
function curId(){return PL.cur}
function curPlayer(){for(var i=0;i<PL.list.length;i++)if(PL.list[i].id===PL.cur)return PL.list[i];PL.cur=PL.list[0].id;return PL.list[0]}
function pk(id,pid){return (pid||curId())+":"+id}
function load(k){try{var v=localStorage.getItem(KEY+k);return v?JSON.parse(v):{}}catch(e){return {}}}
function save(id){var k=pk(id);try{localStorage.setItem(KEY+k,JSON.stringify(state[k]))}catch(e){}}
function st(p){var k=pk(p.id);return state[k]||(state[k]=load(k))}
function getPark(id){for(var i=0;i<PARKS.length;i++)if(PARKS[i].id===id)return PARKS[i];return null}
function nFound(s){var n=0;for(var k in s)if(s[k]==="found")n++;return n}
function doneLines(s){var out=[];LINES.forEach(function(l,i){if(l.every(function(x){return s[x]==="found"}))out.push(i)});return out}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;")}

/* confetti */
var fx=document.getElementById("fx"),ctx=fx.getContext("2d"),bits=[],raf=0;
function burst(n,x,y){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  fx.width=innerWidth;fx.height=innerHeight;
  var cols=["#f6c445","#f4a99b","#4cc38f","#6aa9ff","#d77af0","#fff"];
  for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,v=3+Math.random()*(n>60?9:6);
    bits.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,s:4+Math.random()*5,c:cols[i%cols.length],r:Math.random()*6,life:70+Math.random()*40})}
  if(!raf)tick();
}
function tick(){
  ctx.clearRect(0,0,fx.width,fx.height);
  bits=bits.filter(function(b){return b.life>0});
  bits.forEach(function(b){b.x+=b.vx;b.y+=b.vy;b.vy+=.25;b.vx*=.99;b.r+=.2;b.life--;
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.r);ctx.fillStyle=b.c;ctx.globalAlpha=Math.min(1,b.life/25);ctx.fillRect(-b.s/2,-b.s/2,b.s,b.s*.6);ctx.restore()});
  raf=bits.length?requestAnimationFrame(tick):0;
  if(!raf)ctx.clearRect(0,0,fx.width,fx.height);
}

function armed(btn,fn){
  if(btn.dataset.armed){fn();return}
  btn.dataset.armed="1";var t=btn.textContent;btn.textContent="Tap again to confirm";
  setTimeout(function(){btn.dataset.armed="";btn.textContent=t},3500);
}
function agentCard(){
  if(!AGENT.name)return "";
  return '<div class="agent">'+(AGENT.photo?'<img src="'+AGENT.photo+'" alt="'+esc(AGENT.name)+'">':'')+'<div><b>'+esc(AGENT.name)+'</b>'+
   (AGENT.title?'<br>'+esc(AGENT.title):'')+(AGENT.agency?'<br>'+esc(AGENT.agency):'')+
   (AGENT.phone?'<br><a href="tel:'+esc(AGENT.phone)+'">'+esc(AGENT.phone)+'</a>':'')+
   (AGENT.email?'<br><a href="mailto:'+esc(AGENT.email)+'">'+esc(AGENT.email)+'</a>':'')+
   (AGENT.web?'<br><a href="'+esc(AGENT.web)+'" target="_blank" rel="noopener">'+esc(AGENT.web.replace(/^https?:\/\//,""))+'</a>':'')+'</div></div>';
}
function playerBar(){
  var h='<div class="players"><span class="small">Playing as</span><div class="chips">';
  PL.list.forEach(function(x){h+='<button class="chip'+(x.id===PL.cur?" on":"")+'" data-pid="'+x.id+'">'+esc(x.name)+'</button>'});
  var def=/^Player \d+$/.test(curPlayer().name);
  return h+'<button class="chip" id="addp">+ Add player</button><button class="chip" id="renp">Rename</button></div><div id="renbox"'+(def?'':' hidden')+'><input id="rname" placeholder="Type your name" maxlength="24" aria-label="Your name" value="'+(def?'':esc(curPlayer().name).replace(/"/g,"&quot;"))+'"><button class="btn main" id="rsave">Save name</button></div><div id="addbox" hidden><input id="pname" placeholder="Name" maxlength="24" aria-label="Player name"><button class="btn main" id="padd">Add</button></div></div>';
}
function saveBox(){
  var n=esc(curPlayer().name);
  return '<details class="save"><summary>Save or move progress</summary><p class="small">Progress saves automatically on this device for each player. To keep playing on another device, show the save code for '+n+', copy it, and paste it there.</p><textarea id="code" readonly rows="3" placeholder="Save code appears here"></textarea><button class="btn" id="mk">Show save code for '+n+'</button><textarea id="rcode" rows="2" placeholder="Paste a save code here"></textarea><button class="btn" id="rs">Restore from code</button><div id="smsg" class="small"></div>'+(PL.list.length>1?'<button class="reset" id="rmp">Remove '+n+'</button>':'')+'</details>';
}
function exportCode(){
  var d={};PARKS.forEach(function(p){d[p.id]=load(pk(p.id))});d.statues=load(pk("statues"));
  return btoa(unescape(encodeURIComponent(JSON.stringify({n:curPlayer().name,d:d}))));
}
function importCode(c){
  var o=JSON.parse(decodeURIComponent(escape(atob(c.trim()))));
  var id="p"+Date.now().toString(36);
  PL.list.push({id:id,name:String(o.n||"Player").slice(0,24)});PL.cur=id;savePlayers();
  for(var k in o.d){
    if(!getPark(k)&&k!=="statues")continue;
    var clean={};for(var i in o.d[k])if(o.d[k][i]==="found"||o.d[k][i]==="skip")clean[i]=o.d[k][i];
    state[pk(k,id)]=clean;try{localStorage.setItem(KEY+pk(k,id),JSON.stringify(clean))}catch(e){}
  }
}
function home(){
  var h='<div class="banner2"><span class="script">Judi’s Pro Park Challenge</span><small>Complete the hunts and become a park expert</small></div>'+agentCard()+'<p class="lead">Pick your park, then find the clues as you explore. Tap a square to see the clue.</p>'+playerBar()+rankCard();
  PARKS.forEach(function(p){var f=nFound(st(p));
    h+='<button class="park" data-id="'+p.id+'"><span class="script">'+p.name+'</span><p>'+p.tag+'</p><div class="bar"><i style="width:'+(100*f/25)+'%"></i></div><div class="small">'+f+' of 25 found</div></button>'});
  h+=bonusCard();
  h+='<button class="park" data-id="leaderboard"><span class="script">Leaderboard</span><p>See who has found the most</p></button>';
  h+='<p class="small">Look up and around, stay with your group, and never rush. Skip any clue that is too crowded or closed.</p>'+saveBox();
  app.innerHTML=h;
  app.querySelectorAll(".park").forEach(function(b){b.onclick=function(){location.hash=b.dataset.id}});
  app.querySelectorAll(".chip[data-pid]").forEach(function(b){b.onclick=function(){PL.cur=b.dataset.pid;savePlayers();home()}});
  document.getElementById("addp").onclick=function(){var bx=document.getElementById("addbox");bx.hidden=!bx.hidden;if(!bx.hidden)document.getElementById("pname").focus()};
  var ec=document.getElementById("expcert");if(ec)ec.onclick=function(){burst(120,innerWidth/2,innerHeight/3);certificate(EXPERT)};
  document.getElementById("renp").onclick=function(){var bx=document.getElementById("renbox");bx.hidden=!bx.hidden;if(!bx.hidden)document.getElementById("rname").focus()};
  document.getElementById("rsave").onclick=function(){var nm=document.getElementById("rname").value.trim();if(!nm)return;curPlayer().name=nm.slice(0,24);savePlayers();home()};
  document.getElementById("padd").onclick=function(){
    var nm=document.getElementById("pname").value.trim();if(!nm)return;
    var id="p"+Date.now().toString(36);PL.list.push({id:id,name:nm.slice(0,24)});PL.cur=id;savePlayers();home();
  };
  document.getElementById("mk").onclick=function(){
    var c=exportCode(),t=document.getElementById("code");t.value=c;t.select();
    try{navigator.clipboard.writeText(c).then(function(){document.getElementById("smsg").textContent="Copied. Paste it on the other device."},function(){document.getElementById("smsg").textContent="Press and hold the code to copy it."})}catch(e){document.getElementById("smsg").textContent="Press and hold the code to copy it."}
  };
  document.getElementById("rs").onclick=function(){
    var v=document.getElementById("rcode").value;if(!v.trim())return;
    try{importCode(v);home()}catch(e){document.getElementById("smsg").textContent="That code did not work. Check that you pasted all of it."}
  };
  var rm=document.getElementById("rmp");
  if(rm)rm.onclick=function(){armed(rm,function(){
    var id=PL.cur;PARKS.forEach(function(p){try{localStorage.removeItem(KEY+pk(p.id,id))}catch(e){}});try{localStorage.removeItem(KEY+pk("statues",id))}catch(e){}
    PL.list=PL.list.filter(function(x){return x.id!==id});PL.cur=PL.list[0].id;savePlayers();home();
  })};
}
function pscore(pid){
  var clues=0,boards=0;
  PARKS.forEach(function(p){var n=nFound(load(pk(p.id,pid)));clues+=n;if(n===25)boards++});
  var ss=load(pk("statues",pid)),sp=0;STATUES.forEach(function(x,i){if(ss[i]==="found")sp++});
  return {clues:clues,boards:boards,st:sp,pts:clues+sp};
}
function rankOf(pid){
  var r=pscore(pid),pts=r.clues+r.st,t,next;
  if(r.boards===PARKS.length&&r.st===36){t="Park Expert";next=""}
  else if(r.boards>=1){t="Park Pro";next="Next: finish all 4 boards and spot all 36 statues to become a Park Expert."}
  else if(pts>=10){t="Park Explorer";next="Next: finish one full board of 25 clues to become a Park Pro."}
  else{t="Park Rookie";next="Next: find "+(10-pts)+" more clues or statues to become a Park Explorer."}
  return {title:t,next:next};
}
function rankCard(){
  var k=rankOf(curId());
  return '<div class="rank"><span class="small">Your title</span><b>'+k.title+'</b><small>'+(k.next||"You did it! Show Judi your certificates.")+'</small>'+(k.title==="Park Expert"?'<button class="btn main" id="expcert" style="margin-top:8px;width:100%">View Park Expert certificate</button>':'')+'</div>';
}
function leaderboard(){
  var rows=PL.list.map(function(x){var r=pscore(x.id);r.name=x.name;r.rank=rankOf(x.id).title;return r}).sort(function(a,b){return b.pts-a.pts||b.boards-a.boards});
  var h='<button class="back" id="back">Back to parks</button><h2 class="script" style="font-size:2.8rem">Leaderboard</h2><p class="lead">1 point for each clue found and 1 point for each statue spotted. This ranks the players on this device.</p>';
  rows.forEach(function(r,i){
    h+='<div class="lb'+(i===0&&r.pts>0?" first":"")+'"><b>'+(i+1)+'</b><span>'+esc(r.name)+' <i>'+r.rank+'</i><small>Clues '+r.clues+' of 100, statues '+r.st+' of 36, boards finished '+r.boards+' of 4</small></span><strong>'+r.pts+' pts</strong></div>';
  });
  app.innerHTML=h;
  document.getElementById("back").onclick=function(){location.hash=""};
}
function hunt(p){
  var s=st(p),f=nFound(s),dl=doneLines(s),hot={};
  dl.forEach(function(i){LINES[i].forEach(function(x){hot[x]=1})});
  var h='<button class="back" id="back">Back to parks</button><div class="strip">'+(p.strip||[]).map(function(k){return '<img src="'+IMG[k]+'" alt="">'}).join("")+'</div><div class="board"><div class="title"><span class="script">'+p.name+'</span><b>SCAVENGER HUNT</b></div><div class="grid">';
  p.clues.forEach(function(c,i){h+='<button class="cell '+(s[i]||"")+(hot[i]?" line":"")+'" data-i="'+i+'">'+esc(c[0])+'</button>'});
  h+='</div></div><div class="stats"><span>'+f+' of 25 found</span><span>'+dl.length+' bingo'+(dl.length===1?"":"s")+'</span></div>';
  if(f===25)h+='<div class="banner">Board complete! <button class="btn main" id="cert" style="margin-top:8px">View your certificate</button></div>';
  h+='<button class="reset" id="reset">Start this hunt over</button>';
  app.innerHTML=h;
  document.getElementById("back").onclick=function(){location.hash=""};
  document.getElementById("reset").onclick=function(){armed(this,function(){state[pk(p.id)]={};save(p.id);hunt(p)})};
  var cb=document.getElementById("cert");if(cb)cb.onclick=function(){certificate(p)};
  app.querySelectorAll(".cell").forEach(function(b){b.onclick=function(){sheet(p,+b.dataset.i)}});
}

function sheet(p,i){
  var s=st(p),c=p.clues[i],d=document.createElement("div");d.className="sheet";
  d.innerHTML='<div role="dialog" aria-label="Clue"><h3>'+esc(c[0])+'</h3><p>'+esc(c[1])+'</p>'+(c[2]?'<button class="reset" data-a="hint">Need a hint? Show photo</button><div id="hint"></div>':'')+'<div class="row"><button class="btn main" data-a="found">'+(s[i]==="found"?"Found it":"Found")+'</button><button class="btn" data-a="skip">'+(s[i]==="skip"?"Skipped":"Skip")+'</button></div><button class="reset" data-a="close">Close</button></div>';
  document.body.appendChild(d);
  d.onclick=function(e){
    var a=e.target.dataset&&e.target.dataset.a;
    if(e.target===d||a==="close"){d.remove();return}
    if(a==="hint"){d.querySelector("#hint").innerHTML='<img class="hintimg" src="'+IMG[c[2]]+'" alt="Hint photo">';e.target.remove();return}
    if(!a)return;
    var before=doneLines(s).length;
    s[i]=(s[i]===a)?"":a;save(p.id);d.remove();hunt(p);
    if(s[i]==="found"){
      var now=doneLines(s).length,f=nFound(s);
      if(f===25){burst(160,innerWidth/2,innerHeight/3);setTimeout(function(){certificate(p)},900)}
      else if(now>before){burst(120,innerWidth/2,innerHeight/3)}
      else burst(40,innerWidth/2,innerHeight*.6);
    }
  };
}

function certificate(p){
  var nm=curPlayer().name;if(/^Player \d+$/.test(nm))nm="";
  var w=document.createElement("div");w.className="certwrap";
  var date=new Date().toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"});
  w.innerHTML='<div style="width:100%;max-width:520px;margin:auto"><div class="cert"><h2>CERTIFICATE OF COMPLETION</h2><span class="script">'+(p.certTitle||"Certified Park Pro")+'</span><p>This certifies that</p><input id="nm" placeholder="Type your name" aria-label="Your name" value="'+esc(nm).replace(/"/g,"&quot;")+'"><p>'+(p.certText||('found every clue on the<br><b>'+esc(p.name)+'</b> scavenger hunt'))+'</p><p>'+date+'</p>'+(AGENCY?'<p>'+esc(AGENCY)+'</p>':'')+'</div><div class="row certbtns"><button class="btn main" id="pr">Print or save</button><button class="btn" id="cl">Close</button></div></div>';
  var root=document.getElementById("certroot");root.innerHTML="";root.appendChild(w);
  document.getElementById("nm").oninput=function(e){curPlayer().name=e.target.value||"Player";savePlayers()};
  document.getElementById("pr").onclick=function(){window.print()};
  document.getElementById("cl").onclick=function(){root.innerHTML="";if(p!==EXPERT&&rankOf(curId()).title==="Park Expert"&&!curPlayer().xs){curPlayer().xs=1;savePlayers();burst(160,innerWidth/2,innerHeight/3);certificate(EXPERT)}};
}


var EXPERT={id:"expert",name:"Park Expert",certTitle:"Certified Park Expert",certText:"finished all 4 park scavenger hunts and spotted all 36 golden statues to become a<br><b>Park Expert</b>"};
var SPOT_PARK={id:"statues",name:"Statue Spotter",certTitle:"Statue Spotter Champion",certText:"spotted all 50 characters on the<br><b>golden statues</b> across 4 parks"};
var MK="Magic Kingdom",EP="EPCOT",HS="Hollywood Studios",AK="Animal Kingdom";
// [park, statue, number of characters, where to look, optional photo key]
var STATUES=[
 [MK,"Lady and Tramp",2,"Main Street U.S.A., on the right side of the town square green."],
 [MK,"Chip and Dale",2,"The Hub (the circle in front of the castle), first group on the left as you walk toward the center."],
 [MK,"Mickey Mouse",1,"The Hub, right side of the center.","x9"],

 [MK,"Donald Duck",1,"The Hub, front left."],

 [MK,"Tinker Bell",1,"The Hub, on a pedestal in the trees. She is the smallest statue, so look closely."],
 [MK,"Pooh and Piglet",2,"The Hub, near the Crystal Palace."],
 [MK,"Abu",1,"Adventureland, above the entrance sign and to the right."],

 [MK,"Mad Hatter",1,"Fantasyland, just past the Cheshire Cat near Mad Tea Party."],
 [MK,"Cogsworth and Lumiere",2,"Fantasyland, near Prince Charming Regal Carrousel."],
 [MK,"Pinocchio",1,"Fantasyland."],

 [EP,"Miguel",1,"Showcase Plaza, between Disney Traders and Port of Entry."],
 [EP,"Dante",1,"Showcase Plaza, next to Miguel."],
 [EP,"Rocket and Groot",2,"Showcase Plaza, at the entrance to World Showcase."],
 [EP,"Olaf and Bruni",2,"Showcase Plaza. Bruni is tiny and hides low on the side of the base."],
 [EP,"Pua and Hei Hei",2,"Showcase Plaza, near the Hawaii food marketplace area."],
 [HS,"BB-8",1,"Animation Courtyard, in front of Dockside Diner and A Frozen Sing-Along Celebration."],
 [HS,"R2-D2",1,"Right next to BB-8."],
 [HS,"Frozone",1,"Animation Courtyard, just past the trees from BB-8 and R2-D2.","x5"],
 [HS,"Edna Mode",1,"Right next to Frozone.","x4"],
 [HS,"Joe Gardner",1,"Just outside the Hollywood Brown Derby entrance."],
 [HS,"Flounder and Sebastian",2,"Animation Courtyard, on the way to Voyage of the Little Mermaid.","x2"],
 [HS,"Woody and Bo Peep",2,"Animation Courtyard, between the Chinese Theater and the big park arches.","x3"],
 [AK,"Bambi and Thumper",2,"Discovery Island, right in front of the Tree of Life."],
 [AK,"Simba",1,"Discovery Island, near Discovery Trading Company."],
 [AK,"Timon and Pumbaa",2,"Next to Simba on Discovery Island."],
 [AK,"Dory and Nemo",2,"Right of the Tree of Life near the Wilderness Explorers clubhouse. Look low, close to the ground."]
];
function spotCounts(s){var a=0,c=0;STATUES.forEach(function(x,i){if(s[i]==="found"){a++;c+=x[2]}});return {st:a,ch:c}}
function bonusCard(){var c=spotCounts(st(SPOT_PARK));
  return '<button class="park" data-id="statue-spotter"><span class="script">Statue Spotter</span><p>Bonus game: the golden character statues in all 4 parks</p><div class="bar"><i style="width:'+(100*c.ch/50)+'%"></i></div><div class="small">'+c.ch+' of 50 characters spotted</div></button>'}
function spotter(){
  var p=SPOT_PARK,s=st(p),c=spotCounts(s);
  var h='<button class="back" id="back">Back to parks</button><h2 class="script" style="font-size:2.8rem">Statue Spotter</h2><p class="lead">Find the golden character statues. Tap a statue to see where to look, then mark it spotted.</p><div class="bar"><i style="width:'+(100*c.ch/50)+'%"></i></div><div class="stats"><span>'+c.ch+' of 50 characters</span><span>'+c.st+' of 36 statues</span></div>';
  if(c.st===36)h+='<div class="banner">All 50 characters spotted! <button class="btn main" id="cert" style="margin-top:8px">View your certificate</button></div>';
  var last="";
  STATUES.forEach(function(x,i){
    if(x[0]!==last){last=x[0];h+='<h3 class="parkhead">'+x[0]+'</h3>'}
    h+='<button class="srow '+(s[i]==="found"?"found":"")+'" data-i="'+i+'"><span>'+esc(x[1])+'</span><small>'+(x[2]>1?x[2]+" characters":"1 character")+'</small></button>'});
  h+='<p class="small">Statues can be moved. Ask a Cast Member if you cannot find one.</p><button class="reset" id="reset">Start over</button>';
  app.innerHTML=h;
  document.getElementById("back").onclick=function(){location.hash=""};
  document.getElementById("reset").onclick=function(){armed(this,function(){state[pk(p.id)]={};save(p.id);spotter()})};
  var cb=document.getElementById("cert");if(cb)cb.onclick=function(){certificate(p)};
  app.querySelectorAll(".srow").forEach(function(b){b.onclick=function(){spotSheet(+b.dataset.i)}});
}
function spotSheet(i){
  var p=SPOT_PARK,s=st(p),x=STATUES[i],d=document.createElement("div");d.className="sheet";
  d.innerHTML='<div role="dialog" aria-label="Statue"><h3>'+esc(x[1])+'</h3><p><b>'+x[0]+'.</b> '+esc(x[3])+'</p>'+(x[4]?'<button class="reset" data-a="hint">Need a hint? Show photo</button><div id="hint"></div>':'')+'<div class="row"><button class="btn main" data-a="found">'+(s[i]==="found"?"Spotted it":"Spotted")+'</button></div><button class="reset" data-a="close">Close</button></div>';
  document.body.appendChild(d);
  d.onclick=function(e){
    var a=e.target.dataset&&e.target.dataset.a;
    if(e.target===d||a==="close"){d.remove();return}
    if(a==="hint"){d.querySelector("#hint").innerHTML='<img class="hintimg" src="'+IMG[x[4]]+'" alt="Statue photo">';e.target.remove();return}
    if(a!=="found")return;
    var was=parkDone(s,x[0]);
    s[i]=s[i]==="found"?"":"found";save(p.id);d.remove();spotter();
    if(s[i]==="found"){
      if(spotCounts(s).st===36){burst(160,innerWidth/2,innerHeight/3);setTimeout(function(){certificate(p)},900)}
      else if(!was&&parkDone(s,x[0]))burst(120,innerWidth/2,innerHeight/3);
      else burst(40,innerWidth/2,innerHeight*.6);
    }
  };
}
function parkDone(s,park){return STATUES.every(function(x,i){return x[0]!==park||s[i]==="found"})}

function route(){
  var p=getPark(location.hash.replace("#",""));
  if(p)hunt(p);else if(location.hash==="#statue-spotter")spotter();else if(location.hash==="#leaderboard")leaderboard();else home();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
window.addEventListener("resize",function(){fx.width=innerWidth;fx.height=innerHeight});
route();
</script>
